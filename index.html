:root{
  --paper:#f2ede3;
  --ink:#1c1a16;
  --soft:#6b655a;
  --rule:#cfc6b4;
  --serif:"Cormorant",Garamond,"Times New Roman",serif;
  --mono:"Courier Prime","Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--mono);
  -webkit-font-smoothing:antialiased;
}
/* the card: an inset frame, like a printed invitation */
.card{
  min-height:100svh;
  padding:clamp(16px,3vw,28px);
}
.frame{
  min-height:calc(100svh - 2*clamp(16px,3vw,28px));
  border:1px solid var(--rule);
  display:grid;
  grid-template-rows:1fr auto;
  padding:clamp(28px,6vw,72px) clamp(20px,6vw,80px) clamp(20px,3vw,32px);
}
main{
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;gap:clamp(28px,5vh,52px);
}
h1{
  font-family:var(--serif);font-weight:500;
  font-size:clamp(34px,6.2vw,84px);
  line-height:1.04;letter-spacing:-0.01em;
  max-width:19ch;text-wrap:balance;
}
h1 em{font-style:italic}
.studio{
  font-family:var(--serif);font-style:italic;
  font-size:clamp(19px,2vw,24px);color:var(--soft);
  margin-top:calc(-1 * clamp(12px,2.5vh,28px));
}
.credit{display:flex;flex-direction:column;gap:6px}
.credit .role{
  font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--soft);
}
.credit .name{
  font-family:var(--serif);font-weight:500;
  font-size:clamp(20px,2.2vw,26px);letter-spacing:.14em;text-transform:uppercase;
}
.door{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:440px}
.door p{font-size:13px;letter-spacing:.06em}
form{display:flex;width:100%;border:1px solid var(--ink)}
.hp{position:absolute;left:-9999px}
label.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input[type=email]{
  flex:1;min-width:0;border:0;background:transparent;color:var(--ink);
  font:inherit;font-size:15px;padding:13px 14px;
}
input[type=email]::placeholder{color:var(--soft)}
input[type=email]:focus{outline:none;background:#ebe5d8}
button{
  border:0;border-left:1px solid var(--ink);
  background:var(--ink);color:var(--paper);
  font:inherit;font-size:13px;letter-spacing:.04em;
  padding:13px 16px;cursor:pointer;white-space:nowrap;
}
button:hover{background:#000}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.thanks{
  font-family:var(--serif);font-style:italic;font-size:clamp(20px,2.2vw,24px);
  max-width:28ch;line-height:1.3;
}
.thanks small{display:block;font-family:var(--mono);font-style:normal;font-size:11px;color:var(--soft);margin-top:8px}
.err{font-size:12px;color:#8a2c1c}
footer{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  text-align:center;padding-top:clamp(28px,5vh,48px);
}
.sig{font-family:var(--serif);font-style:italic;font-size:20px}
.legal{font-size:11px;line-height:1.7;color:var(--soft);letter-spacing:.02em}
.legal a{color:inherit;text-underline-offset:3px}
[hidden]{display:none!important}

@media (max-width:480px){
  form{flex-direction:column}
  button{border-left:0;border-top:1px solid var(--ink)}
}
/* a slow fade-in, like a title card */
@media (prefers-reduced-motion:no-preference){
  .fade{opacity:0;animation:in 1.6s ease forwards}
  .d1{animation-delay:.2s}.d2{animation-delay:.9s}.d3{animation-delay:1.6s}.d4{animation-delay:2.3s}.d5{animation-delay:2.9s}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
.mark{font-family:var(--serif);font-weight:500;font-size:clamp(18px,1.8vw,22px);letter-spacing:.42em;text-transform:uppercase;margin-right:-.42em}
h1{max-width:none;font-size:clamp(52px,9vw,128px);letter-spacing:-0.015em;line-height:1}
h1 .dot{font-style:italic;color:var(--soft)}
.tag{font-size:12px;letter-spacing:.32em;text-transform:uppercase;margin-top:calc(-1 * clamp(10px,2vh,24px));margin-right:-.32em}
.logo{width:clamp(64px,7vw,88px);height:auto;margin-bottom:calc(-1 * clamp(8px,2vh,20px))}
</style>
</head>
<body>
